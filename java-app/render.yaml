services:
  - type: web
    name: github-issue-analyzer
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: LLM_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: HF_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: GITHUB_TOKEN
        sync: false  # Optional: Set manually in Render dashboard
    healthCheckPath: /health
    autoDeploy: true
