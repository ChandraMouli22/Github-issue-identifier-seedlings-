name: Java CI/CD Pipeline

on:
  push:
    branches: [ java ]
  pull_request:
    branches: [ java ]

jobs:
  test:
    name: Test (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: ['17', '21', '22']

    defaults:
      run:
        working-directory: java-app

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: 'maven'
        cache-dependency-path: 'java-app/pom.xml'

    - name: Build and Test
      run: mvn clean verify

    - name: Upload test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports-jdk-${{ matrix.java-version }}
        path: java-app/target/surefire-reports/

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: java-app

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
        cache-dependency-path: 'java-app/pom.xml'

    - name: Compile and check for warnings
      run: mvn clean compile

    - name: Verify no unused dependencies
      run: mvn dependency:analyze
      continue-on-error: true
